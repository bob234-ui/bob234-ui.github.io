<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 4 Sign Up Form</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>

<body>

<h1> Sign Up Form </h1>

<fieldset>
    <legend>Sign Up</legend>

    First Name: <input id="firstName"><br>
    Last Name: <input id="lastName"><br>
    Email: <input id="email"><br>
    Phone Number: <input id="phone"><br><br>

    Zip Code: <input id="zipCode">
    <span id="zipStatus"></span><br>

    City: <span id="city"></span><br>
    Latitude: <span id="latitude"></span><br>
    Longitude: <span id="longitude"></span><br><br>

    State:
    <select id="state"></select><br>

    Select a County:
    <select id="county"></select><br><br>

    Desired Username:
    <input id="username">
    <span id="usernameStatus"></span><br>

    Password:
    <input id="password">
    <span id="suggestedPassword"></span><br>

    Type Password Again:
    <input id="retypePassword">
    <span id="matchStatus"></span><br><br>

    <button id="submitBtn">Sign Up!</button>
    <div id="formStatus"></div>

</fieldset>

</body>
</html>
